name: Upload translations

on:
  workflow_dispatch:

concurrency:
  group: "upload-translations"
  cancel-in-progress: true

jobs:
  upload-translations:
    runs-on: ubuntu-latest

    if: ${{ github.repository == 'Nitro-Bolt/extensions' && github.ref == 'refs/heads/master' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Upload translations
        run: pnpm run upload-translations
        env:
          TRANSIFEX_TOKEN: "${{ secrets.TRANSIFEX }}"
          TRANSIFEX_ORGANIZATION: "nitrobolt"
          TRANSIFEX_PROJECT: "nitrobolt"
          TRANSIFEX_RUNTIME_RESOURCE: "extension-runtime"
          TRANSIFEX_METADATA_RESOURCE: "extension-metadata"
